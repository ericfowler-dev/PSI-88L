# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Approved pilot: one 2 GB service and a 5 GB persistent disk.
# Scale-out template: deploy/render-scalable.yaml (requires PostgreSQL and S3).
services:
  - type: web
    name: psi-88l
    runtime: node
    plan: standard
    region: oregon
    repo: https://github.com/ericfowler-dev/PSI-88L
    branch: main
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node scripts/start-disk.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    disk:
      name: psi-88l-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 22.21.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/psi-88l
      - key: ALLOW_LOCAL_STORAGE
        value: 'true'
      - key: WORKER_MODE
        value: embedded
      - key: APP_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
